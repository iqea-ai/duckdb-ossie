#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: ossie

  # Drives examples/server.sql over MCP with the extension THIS run built, loaded from its file into a
  # stock CLI. It used to install ossie from the community registry, which made every merge wait on
  # DuckDB publishing the very version under review: the registry never has the code a PR introduces.
  # The registry path is still tested, after publishing, by RegistryCheck.yml.
  mcp-round-trip:
    name: MCP round trip
    needs: duckdb-stable-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: ossie-v1.5.6-extension-linux_amd64
          path: downloaded

      # A stock CLI and network rather than this repo's build tree: static linking there is exactly
      # what hid the bug this job exists to catch, where server.sql never loaded the extension it
      # demonstrates. duckdb_mcp still comes from the registry, as it does for a user.
      # Pinned to the DuckDB version the extension is built against, not to whatever
      # install.duckdb.org calls latest. This job tests our artifact in the CLI it targets; following
      # "latest" made it test the world's release schedule instead, and it went red on every DuckDB
      # release day with no change on our side. The installer only refreshes its `latest` directory
      # when the requested version is upstream's latest, so PATH must name the versioned directory.
      - name: Install the DuckDB CLI
        env:
          # Must match duckdb_version in duckdb-stable-build, minus the leading v.
          DUCKDB_VERSION: 1.5.6
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/$DUCKDB_VERSION" >> "$GITHUB_PATH"

      - name: Speak MCP to the server, running the built extension
        env:
          OSSIE_EXTENSION: downloaded/ossie.duckdb_extension
        run: python3 scripts/mcp_check.py

  # Load the file we actually ship.
  #
  # Every other test runs inside a build tree, where the extension is statically linked into the
  # binary under test -- so the load path is never exercised. That is the shape of the v0.1.0 bug:
  # examples/server.sql worked in the build tree and failed for everyone who installed normally,
  # with CI green throughout. The registry has a job for this (generate_docs.yml) but it is
  # disabled there with `if: false`, so nothing in the publish path opens the artifact either.
  #
  # -unsigned is correct here and nowhere else: a freshly built artifact is genuinely unsigned,
  # unlike the signed builds the registry serves.
  artifact-load:
    name: Load built artifact (${{ matrix.arch }})
    needs: duckdb-stable-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: linux_amd64, runner: ubuntu-24.04 }
          - { arch: osx_arm64,   runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # upload-artifact@v4 collapses to the least common ancestor of the paths it was given, so the
      # artifact holds a bare ossie.duckdb_extension, not the build/release/... tree it came from.
      # Download it somewhere neutral and put it where the check script reads $EXT.
      - uses: actions/download-artifact@v4
        with:
          name: ossie-v1.5.6-extension-${{ matrix.arch }}
          path: downloaded

      - name: Place the artifact where the check script reads it
        run: |
          find downloaded -type f
          mkdir -p build/release/extension/ossie
          cp downloaded/ossie.duckdb_extension build/release/extension/ossie/

      # Same pin as mcp-round-trip, for the same reason: the artifact under test was built for
      # exactly this version and loads in no other.
      - name: Install the stock DuckDB CLI
        env:
          # Must match duckdb_version in duckdb-stable-build, minus the leading v.
          DUCKDB_VERSION: 1.5.6
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/$DUCKDB_VERSION" >> "$GITHUB_PATH"

      - name: Run the functionality check against the artifact
        run: |
          set -uo pipefail
          EXT=build/release/extension/ossie/ossie.duckdb_extension
          test -f "$EXT" || { echo "::error::artifact missing at $EXT"; exit 1; }

          out=$(./scripts/full_functionality_check.sh); status=$?
          echo "$out"

          # The script falls back to the build-tree binary when the artifact will not load. That
          # binary does not exist on a runner, so the fallback fails unreadably -- assert the mode
          # explicitly so "the artifact did not load" is what gets reported.
          case "$out" in
            *FAITHFUL*) ;;
            *) echo "::error::fell back to the build tree -- the artifact did not load"; exit 1 ;;
          esac
          exit $status

  # One stable check name for branch protection to require.
  #
  # The build matrix cannot be required directly: its check names embed the full matrix tuple
  # ("Build extension binaries / Linux (linux_amd64, ubuntu-24.04, x64-linux-release, ...)"), so any
  # matrix change or extension-ci-tools bump would leave a required check that never reports and
  # every PR stuck on "waiting for status". This job's name never changes.
  #
  # if: always() is load-bearing. Without it a failed dependency SKIPS this job, and GitHub can
  # count a skipped required check as satisfied -- the gate would silently pass on a red build.
  ci-gate:
    name: CI gate
    if: always()
    needs: [duckdb-stable-build, artifact-load, mcp-round-trip, code-quality-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to have succeeded
        run: |
          echo "build    = ${{ needs.duckdb-stable-build.result }}"
          echo "artifact = ${{ needs.artifact-load.result }}"
          echo "mcp      = ${{ needs.mcp-round-trip.result }}"
          echo "quality  = ${{ needs.code-quality-check.result }}"
          [ "${{ needs.duckdb-stable-build.result }}" = success ] \
          && [ "${{ needs.artifact-load.result }}" = success ] \
          && [ "${{ needs.mcp-round-trip.result }}" = success ] \
          && [ "${{ needs.code-quality-check.result }}" = success ]

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: ossie
      format_checks: 'format;tidy'
